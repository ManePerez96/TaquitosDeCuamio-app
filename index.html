<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquitos de Cuamio - Responsivo</title>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #f1faee;
            --accent: #ffb703;
            --text: #1d3557;
            --success: #d1ffcf;
            --edit: #457b9d;
            --price-color: #2a9d8f;
            --divider: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px; /* Menos padding en móviles */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://raw.githubusercontent.com/ManePerez96/TaquitosDeCuamio-app/main/tacos%202.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.3); 
            z-index: -1;
        }

        .container {
            background: rgba(0, 0, 0, 0.92);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .header-logo { text-align: center; margin-bottom: 20px; }
        .header-logo img {
            width: 100%;
            max-width: 350px;
            height: auto;
            filter: drop-shadow(2px 2px 10px rgba(0,0,0,0.8));
        }

        /* Barra de Precio Responsiva */
        .config-bar {
            background: rgba(255, 210, 97, 0.9);
            color: #000;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap; /* Permite que baje si no cabe */
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            text-align: center;
        }

        .config-bar input {
            width: 90px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #000;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Formulario Responsivo con CSS Grid */
        .form-group {
            display: grid;
            grid-template-columns: 1fr 2fr 130px auto; /* Layout Desktop */
            gap: 10px;
            margin-bottom: 25px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
        }

        /* Tabla con scroll horizontal en móviles */
        .table-wrapper {
            width: 100%;
            overflow-x: auto; /* Scroll lateral activo */
            background: white;
            border-radius: 10px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; /* Evita que se aplaste demasiado */ }
        th { background: rgb(255, 210, 97); color: #000; padding: 12px; text-align: left; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: top; color: #333; font-size: 0.9rem; }

        .price-tag { color: var(--price-color); font-weight: bold; font-size: 1.1rem; }
        .actions { display: flex; gap: 5px; }
        .btn-action { color: white; border: none; border-radius: 6px; cursor: pointer; padding: 8px; font-size: 0.9rem; }
        .btn-delete { background: #ff5151; }
        .btn-edit { background: #13aeeb; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* --- MEDIA QUERIES (MAGIA RESPONSIVA) --- */

        /* Tablets y Celulares Grandes */
        @media (max-width: 900px) {
            .form-group {
                grid-template-columns: 1fr 1fr; /* 2 columnas */
            }
            .btn-main { grid-column: span 2; } /* Botón ocupa todo el ancho */
        }

        /* Celulares Pequeños */
        @media (max-width: 600px) {
            .form-group {
                grid-template-columns: 1fr; /* Todo en una sola columna */
            }
            .btn-main { grid-column: span 1; }
            .header-logo img { max-width: 250px; }
            .container { padding: 1rem; }
            .config-bar span { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logo">
            <img src="https://raw.githubusercontent.com/ManePerez96/TaquitosDeCuamio-app/main/logotacos3.PNG" alt="Logo">
        </div>

        <div class="config-bar">
            <span>💲 Precio por Taco: $</span>
            <input type="number" id="precioUnitario" value="3.00" step="0.01" oninput="recalcularPreciosVisuales()">
        </div>

        <div id="formulario" class="form-group">
            <input type="text" id="nombre" placeholder="Nombre Cliente">
            <textarea id="orden" placeholder="Pedido (ej: 3 suadero, 2 pastor)"></textarea>
            <input type="time" id="hora">
            <button id="btnPrincipal" class="btn-main" onclick="procesarPedido()">Agregar</button>
        </div>

        <div class="table-wrapper">
            <table id="tablaPedidos">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;">✓</th>
                        <th>Cliente</th>
                        <th>Orden</th>
                        <th style="width: 70px;">Hora</th>
                        <th style="width: 90px;">Total</th>
                        <th style="width: 100px;">Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } 
            from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8-WKFkouJA5P7QBzv23QMq9LbiWtU5g0",
            authDomain: "taquitosdecuamiocloud.firebaseapp.com",
            projectId: "taquitosdecuamiocloud",
            storageBucket: "taquitosdecuamiocloud.firebasestorage.app",
            messagingSenderId: "938261728188",
            appId: "1:938261728188:web:ff8507e29abf9ab20b79b9",
            measurementId: "G-9T6P3ZH2RV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pedidosRef = ref(db, 'pedidos');

        let idEnEdicion = null;
        let listaGlobal = {};

        function obtenerCantidadTacos(texto) {
            const numeros = texto.match(/\d+/g);
            return numeros ? numeros.reduce((acc, num) => acc + parseInt(num), 0) : 0;
        }

        window.recalcularPreciosVisuales = () => renderizarTabla(listaGlobal);

        function formatearOrden(texto) {
            return texto.split('\n').map(bloque => {
                if(!bloque.trim()) return "";
                const items = bloque.split(',').map(item => item.trim() ? `• ${item.trim()}<br>` : "").join('');
                return `<div style="margin-bottom:5px; border-bottom:1px solid #eee;">${items}</div>`;
            }).join('');
        }

        window.procesarPedido = function() {
            const nombre = document.getElementById('nombre').value;
            const orden = document.getElementById('orden').value;
            const hora = document.getElementById('hora').value;

            if (!nombre.trim() || !orden.trim()) return alert("Completa los campos.");
            const datos = { nombre, orden, hora: hora || "--:--", listo: false };

            if (idEnEdicion) {
                update(ref(db, `pedidos/${idEnEdicion}`), datos);
                idEnEdicion = null;
                document.getElementById('btnPrincipal').innerText = "Agregar";
            } else {
                push(pedidosRef, datos);
            }
            document.getElementById('nombre').value = "";
            document.getElementById('orden').value = "";
            document.getElementById('hora').value = "";
        };

        onValue(pedidosRef, (snapshot) => {
            listaGlobal = snapshot.val();
            renderizarTabla(listaGlobal);
        });

        function renderizarTabla(data) {
            const tbody = document.querySelector('#tablaPedidos tbody');
            const precioBase = parseFloat(document.getElementById('precioUnitario').value) || 0;
            tbody.innerHTML = "";
            if (data) {
                const lista = Object.keys(data).map(id => ({ id, ...data[id] }));
                lista.sort((a, b) => a.hora.localeCompare(b.hora));
                lista.forEach(p => {
                    const totalCalculado = (obtenerCantidadTacos(p.orden) * precioBase).toFixed(2);
                    const fila = document.createElement('tr');
                    if (p.listo) fila.style.opacity = "0.4";
                    fila.innerHTML = `
                        <td style="text-align:center"><input type="checkbox" ${p.listo ? 'checked' : ''} onclick="cambiarEstado('${p.id}', ${!p.listo})" style="transform:scale(1.3)"></td>
                        <td><strong>${p.nombre}</strong></td>
                        <td>${formatearOrden(p.orden)}</td>
                        <td>${p.hora}</td>
                        <td class="price-tag">$${totalCalculado}</td>
                        <td class="actions">
                            <button class="btn-action btn-edit" onclick="cargarEdicion('${p.id}', '${p.nombre}', \`${p.orden.replace(/`/g, '\\`')}\`, '${p.hora}')">✏️</button>
                            <button class="btn-action btn-delete" onclick="eliminarPedido('${p.id}')">✕</button>
                        </td>`;
                    tbody.appendChild(fila);
                });
            }
        }

        window.cambiarEstado = (id, est) => update(ref(db, `pedidos/${id}`), { listo: est });
        window.cargarEdicion = (id, nom, ord, hr) => {
            idEnEdicion = id;
            document.getElementById('nombre').value = nom;
            document.getElementById('orden').value = ord;
            document.getElementById('hora').value = hr === "--:--" ? "" : hr;
            document.getElementById('btnPrincipal').innerText = "Guardar";
            window.scrollTo(0, 0);
        };
        window.eliminarPedido = (id) => { if(confirm("¿Eliminar?")) remove(ref(db, `pedidos/${id}`)); };
    </script>
</body>
</html>
