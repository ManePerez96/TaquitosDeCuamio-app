<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taquitos de Cuamio</title>
<style>
:root {
--primary: #e63946;
--secondary: #f1faee;
--accent: #ffb703;
--text: #1d3557;
--success: #d1ffcf;
}

body {
font-family: 'Segoe UI', sans-serif;
background-color: #f0f2f5;
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}

.container {
background: white;
padding: 2rem;
border-radius: 15px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 100%;
max-width: 900px;
}

h1 { color: var(--primary); text-align: center; margin-top: 0; }

.form-group {
display: grid;
grid-template-columns: 1fr 2fr 150px auto;
gap: 15px;
margin-bottom: 25px;
background: #f9f9f9;
padding: 20px;
border-radius: 10px;
}

input, textarea {
padding: 12px;
border: 2px solid #ddd;
border-radius: 8px;
font-size: 1rem;
outline: none;
}

textarea { resize: vertical; min-height: 45px; font-family: inherit; }

.btn-add {
background: var(--primary);
color: white;
border: none;
padding: 12px;
border-radius: 8px;
cursor: pointer;
font-weight: bold;
transition: background 0.3s;
}

.btn-add:hover { background: #c1121f; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }

th { background: var(--text); color: white; padding: 12px; text-align: left; }

td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; white-space: pre-line; }

tr.ready { background: var(--success); text-decoration: line-through; opacity: 0.6; }

.btn-delete { background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 5px 10px; }

input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }

@media (max-width: 750px) { .form-group { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>🌮 Taquitos de Cuamio</h1>

<div class="container">
<div class="form-group">
<input type="text" id="nombre" placeholder="Nombre del cliente">
<textarea id="orden" placeholder="Pedido (puedes dar saltos de línea)"></textarea>
<input type="time" id="hora">
<button class="btn-add" onclick="agregarPedido()">Agregar Pedido</button>
</div>

<table id="tablaPedidos">
<thead>
<tr>
<th>Listo</th>
<th>Nombre</th>
<th>Orden</th>
<th>Hora</th>
<th>Borrar</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- CARGA DE MÓDULOS DE FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove }
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

// Tu configuración de Firebase proporcionada
const firebaseConfig = {
apiKey: "AIzaSyC8-WKFkouJA5P7QBzv23QMq9LbiWtU5g0",
authDomain: "taquitosdecuamiocloud.firebaseapp.com",
projectId: "taquitosdecuamiocloud",
storageBucket: "taquitosdecuamiocloud.firebasestorage.app",
messagingSenderId: "938261728188",
appId: "1:938261728188:web:ff8507e29abf9ab20b79b9",
measurementId: "G-9T6P3ZH2RV"
};

// Inicialización
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pedidosRef = ref(db, 'pedidos');

// Función para AGREGAR pedido a la nube
window.agregarPedido = function() {
const nombre = document.getElementById('nombre').value;
const orden = document.getElementById('orden').value;
const hora = document.getElementById('hora').value;

if (nombre.trim() && orden.trim()) {
push(pedidosRef, {
nombre: nombre,
orden: orden,
hora: hora || "--:--",
listo: false
});
// Limpiar campos
document.getElementById('nombre').value = "";
document.getElementById('orden').value = "";
document.getElementById('hora').value = "";
document.getElementById('nombre').focus();
} else {
alert("Por favor llena el nombre y la orden");
}
};

// Escuchar cambios en TIEMPO REAL
onValue(pedidosRef, (snapshot) => {
const tbody = document.querySelector('#tablaPedidos tbody');
tbody.innerHTML = "";
const data = snapshot.val();

if (data) {
// Convertimos a lista y ordenamos por hora
const lista = Object.keys(data).map(id => ({ id, ...data[id] }));
lista.sort((a, b) => a.hora.localeCompare(b.hora));

lista.forEach(p => {
const tr = document.createElement('tr');
if (p.listo) tr.classList.add('ready');

tr.innerHTML = `
<td style="text-align:center">
<input type="checkbox" ${p.listo ? 'checked' : ''}
onclick="cambiarEstado('${p.id}', ${!p.listo})">
</td>
<td><strong>${p.nombre}</strong></td>
<td>${p.orden}</td>
<td>${p.hora}</td>
<td><button class="btn-delete" onclick="eliminarPedido('${p.id}')">✕</button></td>
`;
tbody.appendChild(tr);
});
}
});

// Cambiar estado Listo/Pendiente en el servidor
window.cambiarEstado = (id, nuevoEstado) => {
update(ref(db, `pedidos/${id}`), { listo: nuevoEstado });
};

// Eliminar pedido del servidor
window.eliminarPedido = (id) => {
if(confirm("¿Seguro que quieres borrar este pedido?")) {
remove(ref(db, `pedidos/${id}`));
}
};
</script>
</body>
</html>
